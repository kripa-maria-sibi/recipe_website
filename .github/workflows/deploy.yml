name: Deploy Backend to Ubuntu

on:
  push:
    branches:
      - main

env:
  DEPLOY_DIR: /opt/intern_recipe_website

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        run: |
          [ -n "${{ secrets.SSH_HOST }}" ] || (echo "Missing secret: SSH_HOST" && exit 1)
          [ -n "${{ secrets.SSH_USER }}" ] || (echo "Missing secret: SSH_USER" && exit 1)
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] || (echo "Missing secret: SSH_PRIVATE_KEY" && exit 1)
          [ -n "${{ secrets.SSH_PORT }}" ] || (echo "Missing secret: SSH_PORT" && exit 1)

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            sudo mkdir -p "${{ env.DEPLOY_DIR }}"
            sudo chown -R "${{ secrets.SSH_USER }}":"${{ secrets.SSH_USER }}" "${{ env.DEPLOY_DIR }}"

      - name: Copy project files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "."
          target: ${{ env.DEPLOY_DIR }}
          overwrite: true
          rm: false
          strip_components: 0
          exclude: ".git,node_modules,.github"

      - name: Run Docker Compose on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ env.DEPLOY_DIR }}"
            docker compose down || true
            docker compose up -d --build
